<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Heirloom private backup test</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:16px;background:#faf9f6;color:#20303c}button{font:inherit;padding:14px;border:1px solid #0161a8;border-radius:10px;color:#0161a8;background:white;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#0161a8}</style><h1>Private backup test</h1><p>Development test only. Uses synthetic test data, no customer jobs. Each Google account can access only its own app-private backups. No general Drive-file access is requested.</p><button id="connect">Connect Google account</button><button id="save" disabled>Save synthetic job and verify restore</button><button id="restore" disabled>Restore saved synthetic test</button><button id="disconnect">Disconnect</button><pre id="status" role="status">Not connected.</pre><script src="https://accounts.google.com/gsi/client" async defer></script><script src="../private-backup.js"></script><script>
const status=document.querySelector('#status');let account;
function show(t){status.textContent=t;}
document.querySelector('#connect').onclick=async()=>{try{account=await HeirloomBackup.connect();show('Connected: '+account.email);document.querySelector('#save').disabled=false;document.querySelector('#restore').disabled=false;}catch(e){show(e.message)}};
document.querySelector('#disconnect').onclick=()=>{HeirloomBackup.disconnect();account=null;document.querySelector('#save').disabled=true;document.querySelector('#restore').disabled=true;show('Disconnected. No token is saved on this device.');};
document.querySelector('#save').onclick=async function(){this.disabled=true;try{show('Writing synthetic job and verifying full readback...');let job={id:crypto.randomUUID(),name:'Synthetic backup restore test',address:'No real address',updatedAt:new Date().toISOString(),draft:{fields:{customer:'Synthetic backup restore test'},items:{'2-0':{qty:7,note:'Synthetic note'}},photoIds:['test-photo']},photos:[{id:'test-photo',item:'2-0',mime:'image/svg+xml',width:40,height:30,caption:'Synthetic photo equivalent',kind:'general',blob:new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30"><rect width="40" height="30" fill="#0161a8"/></svg>'],{type:'image/svg+xml'})}]};let result=await HeirloomBackup.upload(job);show('PASS: '+account.email+'\nFull synthetic job and photo bytes uploaded and read back with SHA-256 verification.\nFile: '+result.fileId+'\nJob: '+job.id+'\nVerified: '+result.verifiedAt+'\nLocal draft was not needed for restore.');}catch(e){show('FAILED: '+e.message);}finally{this.disabled=false;}};
document.querySelector('#restore').onclick=async function(){this.disabled=true;try{show('Reading only this account\'s private app files...');let files=await HeirloomBackup.list(),checks=[];for(let f of files.slice(0,10)){let job=await HeirloomBackup.download(f);checks.push(job.name+' | '+job.id+' | photos '+job.photos.length+' | quantity '+job.draft.items['2-0'].qty);}show('Connected: '+account.email+'\n'+files.length+' account-private backup files\n'+checks.join('\n'));}catch(e){show('FAILED: '+e.message)}finally{this.disabled=false;}};
</script></html>
