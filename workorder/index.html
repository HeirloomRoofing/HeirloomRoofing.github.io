  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',-apple-system,Helvetica,Arial,sans-serif; font-weight:500; }

  /* Aligned choice tiles: short answers share a row; longer lists stay easy to scan. */
  .chips { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .chip { min-width:0; min-height:46px; border-radius:10px; padding:11px 12px; line-height:1.35; text-align:center; }
  .chips > .chip:last-child:nth-child(odd) { grid-column:1 / -1; }

    .chips[data-f="layers"] > .chip:last-child:nth-child(odd), .chips[data-f="stories"] > .chip:last-child:nth-child(odd), .chips[data-f="fascia"] > .chip:last-child:nth-child(odd) { grid-column:auto; }

  .chips[data-multi], .chips[data-f="decking"] { grid-template-columns:1fr; }

    sections.forEach(function(section,i){var badge=section.querySelector(':scope > summary .section-count');var initial=!!(section.compareDocumentPosition(document.getElementById('genbtn2'))&Node.DOCUMENT_POSITION_FOLLOWING);badge.textContent=section===photosCard.querySelector('.form-section')?(photoRecords.filter(function(r){return r.item.indexOf('area-')===0;}).length+' photos'):(counts[i]===0?'Ready':counts[i]+' unanswered');badge.className='section-count'+(section===photosCard.querySelector('.form-section')?(emptyPhotoFields?' pending':' ready'):(counts[i]?' pending':' ready'));});
  }
  ['input','change','click','toggle'].forEach(function(event){document.getElementById('form').addEventListener(event,function(){setTimeout(updateSectionCounts,0);},true);});
  function initialEntryMissing(){
    var keys=missingRequired('top');
    ['pm','pmphone','jt','pmnotes','customer','phone','address','gate'].forEach(function(k){if(k==='gate'&&gateNA())return;if(!val(k)&&keys.indexOf(k)<0)keys.push(k);});
    return keys;
  }
  ['pmnotes','otherinstr'].forEach(function(id){var el=document.getElementById(id),button=document.createElement('button');button.type='button';button.className='btn ghost answer-none';button.textContent='None';button.setAttribute('aria-label','Set '+FIELD_LABELS[id]+' to None');button.onclick=function(){if(el.value.trim()&&el.value.trim()!=='None'&&!confirm('Replace this note with None?'))return;el.value='None';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};el.after(button);});
  document.getElementById('form').addEventListener('focusin',function(e){var el=e.target;if(el.matches('input[type=number]')&&el.value!==''){try{el.select();}catch(ignore){}}});
  restore();
  document.querySelectorAll('[data-sizeitem]').forEach(function(el){syncSizeUI(el.dataset.sizeitem);});
  syncACWorkItem();
  ['4-5','4-6'].forEach(syncScopeQuantity);
  updateAccessoryPhotoTallies();
  updateCounts();
  updateSectionCounts();
  photoReady=loadJobPhotos();
})();
