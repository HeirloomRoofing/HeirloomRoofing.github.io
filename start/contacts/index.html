<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company contacts | Heirloom Roofing</title>
<meta name="description" content="Heirloom Roofing company contacts - save a card, text, call, or email.">
<meta name="robots" content="noindex">
<style>
  @font-face { font-family:'Space Grotesk'; font-style:normal; font-weight:300 700; font-display:swap; src:url('/kit/fonts/sg-latin.woff2') format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152,U+0153,U+02BB,U+02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+FEFF,U+FFFD; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100svh; background:#0161A8; font-family:'Space Grotesk',-apple-system,Helvetica,Arial,sans-serif; font-weight:500; color:#1c2b36; }
  .band { background:#0161A8; padding:26px 20px 58px; text-align:center; }
  .band img { width:150px; height:75px; object-fit:contain; }
  .band h1 { margin:8px 0 0; color:#fff; font-size:26px; font-weight:700; }
  main { max-width:460px; margin:-34px auto 0; padding:0 20px 30px; }
  a.person { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #e3e8ec; border-radius:18px; padding:18px; margin-top:14px; text-decoration:none; color:#1c2b36; box-shadow:0 10px 26px rgba(1,97,168,.10); }
  a.person:active { filter:brightness(.96); }
  a.person .nm { font-size:20px; font-weight:700; color:#0161A8; }
  a.person .sub { font-size:13px; color:#5a6b78; margin-top:2px; }
  a.person .chev { margin-left:auto; color:#0161A8; font-size:22px; font-weight:700; }
  .lock { font-size:12px; color:#5a6b78; }
  h2.sec { margin:30px 4px 0; font-size:14px; font-weight:700; color:rgba(255,255,255,.85); text-transform:uppercase; letter-spacing:.5px; }
  .carrier { background:#fff; border:1px solid #e3e8ec; border-radius:18px; padding:16px 18px; margin-top:14px; box-shadow:0 10px 26px rgba(1,97,168,.10); }
  .carrier .nm { font-size:20px; font-weight:700; color:#0161A8; }
  .carrier .acts { display:flex; gap:10px; margin-top:10px; }
  .carrier .act { flex:1; text-align:center; background:#0161A8; color:#fff; font-weight:700; font-size:15px; padding:10px 8px; border-radius:12px; text-decoration:none; }
  .carrier .act:active { filter:brightness(.9); }
  a.back { display:block; margin-top:20px; text-align:center; color:#fff; font-weight:700; font-size:14px; text-decoration:none; padding-bottom:max(72px,calc(env(safe-area-inset-bottom) + 58px)); }
  .carrier .act::after { content:' \203A'; opacity:.55; }
  a.bigbtn { display:flex; align-items:center; background:#fff; border:1px solid #e3e8ec; border-radius:20px; padding:28px 22px; margin-top:18px; text-decoration:none; color:#1c2b36; box-shadow:0 12px 30px rgba(1,97,168,.14); }
  a.bigbtn:active { filter:brightness(.96); }
  a.bigbtn .nm { font-size:24px; font-weight:700; color:#0161A8; }
  a.bigbtn .chev { margin-left:auto; color:#0161A8; font-size:26px; font-weight:700; }

<div class="band">

<main>
  <a class="bigbtn" href="/start/contacts/heirloom/">

  </a>
  <a class="bigbtn" href="/start/contacts/insurance/">

  <a class="back" href="/start/">&larr; Back</a>
