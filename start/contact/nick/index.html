    var key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(S), iterations:600000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(I)}, key, b64(D));
    var html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch(e) {
    busy.textContent='';
    err.textContent='Wrong PIN - try again.';
    document.getElementById('pw').select();
  }
});
</script>
