<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protected document | Heirloom Roofing</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family:'Space Grotesk'; font-style:normal; font-weight:300 700; font-display:swap; src:url('/kit/fonts/sg-latin.woff2') format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB,U+02BC,U+02C6,U+02DA,U+02DC,U+0300-0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+FEFF,U+FFFD; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100svh; background:#0161A8; font-family:'Space Grotesk',-apple-system,Helvetica,Arial,sans-serif; font-weight:500; color:#1c2b36; }
  .masthead { text-align:center; padding:max(18px,env(safe-area-inset-top)) 20px 16px; }
  .masthead img { width:150px; height:87px; object-fit:contain; }
  main { max-width:760px; margin:0 auto; padding:0 16px 40px; width:100%; }
  .gate { background:#fff; border-radius:18px; box-shadow:0 10px 26px rgba(0,0,0,.18); padding:26px 20px; text-align:center; max-width:460px; margin:24px auto 0; }
  .gate h1 { color:#0161A8; font-size:22px; margin:0 0 6px; }
  .gate p { color:#5a6b78; font-size:14px; margin:0 0 18px; }
  .gate input { width:100%; font-size:26px; letter-spacing:6px; text-align:center; padding:14px; border:1.5px solid #0161A8; border-radius:14px; font-family:inherit; }
  .gate button { width:100%; margin-top:14px; background:#0161A8; color:#fff; border:none; border-radius:14px; font-family:inherit; font-size:18px; font-weight:700; padding:14px; cursor:pointer; }
  .gate button:active { filter:brightness(.9); }
  #err { color:#b3261e; font-weight:700; font-size:14px; min-height:18px; margin-top:10px; }
  canvas.pg { display:block; width:100%; height:auto; margin:0 auto 14px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.18); background:#fff; }
  .tools { text-align:center; margin:18px 0 30px; }
  .tools a { display:inline-block; background:#fff; color:#0161A8; border:1.5px solid #fff; border-radius:999px; font-size:15px; font-weight:700; padding:10px 22px; text-decoration:none; }
  .hint { color:rgba(255,255,255,.85); text-align:center; font-size:13px; margin-top:10px; }
  a.back { display:block; text-align:center; color:#fff; font-weight:700; font-size:15px; text-decoration:none; padding:10px 0 max(40px,env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div class="masthead"><img src="/start/logo.svg" alt="Heirloom Roofing logo"></div>
<main>
  <div class="gate" id="gate">
    <h1>Password protected</h1>
    <p>Enter the 4-digit code to view this document.</p>
    <form id="gateform" autocomplete="off">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-label="Document code">
      <button type="submit">Open document</button>
    </form>
    <div id="err" role="alert"></div>
  </div>
  <div id="doc" hidden></div>
  <div class="tools" id="tools" hidden>
    <a id="dl" href="#" target="_blank" rel="noopener">Download the PDF</a>
    <div class="hint">The download stays password protected.</div>
  </div>
  <a class="back" href="/start/resources/">&larr; Back</a>
</main>
<script type="module">
import * as pdfjsLib from '/start/files/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/start/files/pdfjs/pdf.worker.min.mjs';
var DOCS = {
  'Aidan-calendar-sand.pdf': 'Your Project Calendar',
  'Company-calendar-sand.pdf': 'Your Project Calendar'
};
var params = new URLSearchParams(location.search);
var name = params.get('doc') || '';
var gate = document.getElementById('gate'), err = document.getElementById('err');
if (!DOCS[name]) {
  gate.innerHTML = '<h1>Document not found</h1><p>This link does not match a protected document.</p>';
} else {
  document.title = DOCS[name] + ' | Heirloom Roofing';
  var url = '/start/files/' + encodeURIComponent(name);
  document.getElementById('dl').href = url;
  document.getElementById('pin').focus();
  document.getElementById('gateform').addEventListener('submit', async function(e) {
    e.preventDefault();
    err.textContent = '';
    var pw = document.getElementById('pin').value;
    if (!pw) { err.textContent = 'Enter the code.'; return; }
    try {
      var pdf = await pdfjsLib.getDocument({ url: url, password: pw }).promise;
      document.getElementById('pin').value = '';
      gate.hidden = true;
      var doc = document.getElementById('doc');
      doc.hidden = false; doc.innerHTML = '';
      for (var i = 1; i <= pdf.numPages; i++) {
        var page = await pdf.getPage(i);
        var base = page.getViewport({ scale: 1 });
        var scale = Math.min(2.5, (Math.min(window.innerWidth - 32, 760)) / base.width * 2);
        var vp = page.getViewport({ scale: scale });
        var c = document.createElement('canvas');
        c.className = 'pg'; c.width = vp.width; c.height = vp.height;
        doc.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
      document.getElementById('tools').hidden = false;
      window.scrollTo(0, 0);
    } catch (ex) {
      if (ex && ex.name === 'PasswordException') { err.textContent = 'Wrong code. Try again.'; }
      else { err.textContent = 'Could not open the document. Check your connection and try again.'; }
    }
  });
}
</script>
</body>
</html>
