<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company Resources</title>
<style>
  html { height:100%; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { height:100dvh; display:flex; flex-direction:column; background:#0b3252; font-family:-apple-system,Helvetica,Arial,sans-serif; }
  a { flex:1 1 33%; display:flex; align-items:center; justify-content:center; text-align:center; text-decoration:none; padding:24px; font-size:clamp(26px,7.5vw,40px); font-weight:800; -webkit-tap-highlight-color:transparent; }
  a.one { background:#0161A8; color:#fff; padding-top:max(24px,env(safe-area-inset-top)); }
  a.two { background:#fff; color:#0161A8; }
  a.back { flex:0 0 auto; background:#0b3252; color:#fff; font-size:18px; font-weight:700; padding:18px 24px max(18px,env(safe-area-inset-bottom)); }
  a:active { filter:brightness(.92); }
</style>
</head>
<body>
<a class="one" href="/start/files/Company-calendar.pdf">Company Handout</a>
<a class="two" href="/start/files/Aidan-calendar.pdf">Aidan's Handout</a>
<a class="back" href="/start/">Back</a>
</body>
</html>
